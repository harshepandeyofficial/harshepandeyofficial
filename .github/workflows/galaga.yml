name: Generate Galaga Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create output folder
        run: mkdir -p dist

      - name: Generate graph
        uses: Platane/snk@master
        with:
          github_user_name: harshepandeyofficial
          svg_out_path: dist/galaga-contribution-graph.svg

      - name: Generate dark graph
        uses: Platane/snk@master
        with:
          github_user_name: harshepandeyofficial
          svg_out_path: dist/galaga-contribution-graph-dark.svg
          color_snake: '#39FF14'
          color_dots: '#0d1117'

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
